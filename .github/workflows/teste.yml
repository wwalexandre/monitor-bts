name: Teste do alerta

on:
  push:
    paths:
      - .github/workflows/teste.yml
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Vigiar pagina de teste
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_URL: https://raw.githubusercontent.com/wwalexandre/monitor-bts/main/teste.txt
          MAX_MINUTOS: "20"
        run: python monitor_cloud.py
